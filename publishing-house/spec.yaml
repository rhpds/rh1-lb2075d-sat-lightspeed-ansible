project:
  slug: "rh1-lb2075d-sat-lightspeed-ansible"
  owner_email: "psrivast@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "zero_touch"
  intake_type: "migration"
  automation_type: "ansible"
  description: "A hands on lab that delves into Red Hat Satellite features such as compliance monitoring and scanning, image mode, and vulnerability detection and remediation."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1538"
  workflow_id: "d6e15bda-b5f0-4bc7-a130-528f37c0224c"

spec:
  title: "Red Hat Satellite: Automated CVE Remediation with Lightspeed and AAP"
  learning_objectives:
    - "Explore CVE data in the Red Hat Lightspeed Vulnerability dashboard hosted on-premises by Red Hat Satellite"
    - "Configure a Satellite webhook to send events to AAP's Event-Driven Ansible Event Stream on remote execution job success"
    - "Automate fleet-wide CVE remediation by wiring an EDA rulebook to launch an AAP Job Template that installs fixes across all affected hosts"
    - "Verify end-to-end closed-loop remediation by confirming that vulnerable packages are patched on both managed hosts after a single triggering event"
  modules:
    - {id: module-01-introduction, title: Introduction, duration_min: 3, status: complete, slug: module-01-introduction}
    - {id: module-02-explore-detected-cves, title: "Explore Detected CVEs", duration_min: 5, status: complete, slug: module-02-explore-detected-cves}
    - {id: module-03-configure-satellite-webhook, title: "Configure the Satellite Webhook", duration_min: 8, status: complete, slug: module-03-configure-satellite-webhook}
    - {id: module-04-close-the-loop, title: "Close the Loop: Automatic Remediation", duration_min: 8, status: complete, slug: module-04-close-the-loop}
    - {id: module-05-verify-closed-loop, title: "Verify the Closed Loop", duration_min: 6, status: complete, slug: module-05-verify-closed-loop}
  environment:
    platform: "rhel-vms"              # ocp | rhel-vms — determines which sizing fields apply
    topology: "per-student"    # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: ""                    # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: ""                   # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student:
      - {role: satellite, count: 1, cpu: 8, ram_gb: 32, disk_gb: 540, os: RHEL}
      - {role: aap, count: 1, cpu: 8, ram_gb: 32, disk_gb: 540, os: RHEL}
      - {role: rhel-host, count: 2, cpu: 1, ram_gb: 4, disk_gb: 40, os: "RHEL 10.1"}

    # --- Common fields (both platforms) ---
    aap_version: "2.7"                 # required if AAP in products
    ai_requirement: "none"             # maas | gpu | none
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services: [registry.redhat.io, security.access.redhat.com]  # named external service dependencies e.g. [github.com]
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 0.5
  audience: "intermediate"             # beginner | intermediate | advanced

