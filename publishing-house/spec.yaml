# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: "Zero-Touch Guided lab with runtime-automation solve/validate playbooks per module (solve buttons disabled in ui-config.yml for student-driven experience). Each module ends with a visible, verifiable result: Module 2 — CVE listings in the Vulnerability dashboard; Module 3 — verify-webhook.yml confirms Event Stream received the webhook; Module 4 — all playbooks exit cleanly, EDA Activation log shows Job Template launched; Module 5 — rpm -q on both hosts shows patched OpenSSL (3.5.1-7.el10_1), Vulnerability dashboard shows zero Critical/Important CVEs after insights-client runs."
    catalog_gap: ""
    design_overview: "An intermediate hands-on lab showing how Red Hat Satellite's on-premises Lightspeed Vulnerability service, Event-Driven Ansible, and AAP Controller combine to automatically remediate CVEs fleet-wide with zero manual intervention. Participants wire up a Satellite webhook to EDA, extend a rulebook to launch a remediation Job Template, and verify that vulnerable packages are patched across all managed hosts after a single triggering event."
    module_summaries:
      - title: "Introduction"
        overview: "Introduces the lab's three-component architecture (Satellite, EDA, AAP Controller), describes the four VMs in the environment, and guides participants through logging into both the Satellite and AAP Web UIs."
      - title: "Explore Detected CVEs"
        overview: "Participants navigate the Red Hat Lightspeed Vulnerability dashboard in Satellite, review CVEs affecting rhel1.lab and rhel2.lab by severity and CVSS score, and drill into individual CVE details and fix availability."
      - title: "Configure the Satellite Webhook"
        overview: "Participants run pre-placed Ansible playbooks to create a custom JSON webhook template in Satellite and configure the webhook to POST to AAP's EDA Event Stream on remote execution job success, then verify end-to-end delivery with a test job."
      - title: "Close the Loop: Automatic Remediation"
        overview: "Participants review the vulnerability_remediation.py script and find_and_remediate.yml playbook, create a Satellite API credential in AAP Controller, set up the Controller Project and Job Template, and wire the EDA rulebook to launch the Job Template automatically on webhook receipt."
      - title: "Verify the Closed Loop"
        overview: "Participants trigger a remote execution job on rhel1.lab, watch AAP launch and complete the remediation Job Template, and confirm that patched OpenSSL versions appear on both hosts; they then run insights-client on both hosts to sync the updated package inventory back to Satellite's Vulnerability dashboard."
    rcars_overlap_pct: 72
    rcars_top_matches:
      - title: "Hands on with Red Hat Lightspeed in Satellite"
        ci_name: "zt-rhelbu.zt-lightspeed-satellite.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-rhelbu.zt-lightspeed-satellite.prod"
        relevance_score: 72
        why_it_fits: "Covers Red Hat Lightspeed in Satellite (on-premises/disconnected mode), CVE identification and remediation playbook generation, and Ansible remediation playbooks across RHEL hosts."
      - title: "Introduction to AI-Driven Ansible Automation: Self-healing, Observability-Driven AIOps"
        ci_name: "published.ai-driven-aap.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.ai-driven-aap.prod"
        relevance_score: 67
        why_it_fits: "Section 4 covers Red Hat Lightspeed CVE and Advisor remediation alongside Event-Driven Ansible, and Section 5 addresses autonomous self-healing RHEL workflows — aligning closely with automated fleet-wide CVE detection and remediation."
        workloads:
          - role: "dispatch"
            collection: "infra.aap_configuration"
          - role: "lightspeed_mcp_server"
            collection: "lb2961.ai_driven_aap"
      - title: "Defend, Contain and Comply"
        ci_name: "zt-ansiblebu.zt-ans-defend-contain-comply.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-ansiblebu.zt-ans-defend-contain-comply.prod"
        relevance_score: 55
        why_it_fits: "Covers CVE detection and remediation using Event-Driven Ansible and AAP workflow automation against RHEL infrastructure, with a real Critical CVE scenario (CVSS 9.8) and EDA rulebooks driving automated response."
    catalog_gap: "This design's unique position is the end-to-end on-premises pipeline: Satellite Lightspeed Vulnerability detects CVEs, a Satellite webhook triggers Event-Driven Ansible, and AAP Controller runs a fleet-wide remediation playbook — all without manual intervention and all within the lab network. No existing catalog item combines Satellite, on-premises Lightspeed Vulnerability, EDA webhook integration, and AAP Controller in a single guided intermediate lab."
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
    agnosticv_base_ci: ""
    approved_by: ""
    rejections: []
