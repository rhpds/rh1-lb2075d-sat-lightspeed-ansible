project:
  slug: "rh1-lb2075d-sat-lightspeed-ansible"
  owner_email: "psrivast@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "zero_touch"
  intake_type: "migration"
  automation_type: "ansible"
  description: "A hands on lab that delves into Red Hat Satellite features such as compliance monitoring and scanning, image mode, and vulnerability detection and remediation."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1538"
  workflow_id: "d6e15bda-b5f0-4bc7-a130-528f37c0224c"

spec:
  title: "Red Hat Satellite: Compliance Scanning, Image Mode, and Vulnerability Remediation"
  learning_objectives:
    - "Configure a compliance scanning policy in Red Hat Satellite and assign it to managed RHEL hosts"
    - "Monitor compliance scan results and interpret findings across the managed host inventory"
    - "Deploy a RHEL image mode build through Red Hat Satellite to a managed host"
    - "Analyze vulnerability reports generated by Red Hat Satellite and remediate identified CVEs on managed hosts"
  modules:
    - {id: module-01, title: Introduction, duration_min: 10, status: not_started}
    - {id: module-02, title: Compliance Scanning, duration_min: 30, status: not_started}
    - {id: module-03, title: Image Mode, duration_min: 30, status: not_started}
    - {id: module-04, title: Vulnerability Remediation, duration_min: 30, status: not_started}
  environment:
    platform: "rhel-vms"              # ocp | rhel-vms — determines which sizing fields apply
    topology: ""               # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: ""                    # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: ""                   # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student:
      - {role: satellite, count: 1, cpu: null, ram_gb: null, disk_gb: null, os: RHEL}
      - {role: rhel-host, count: 2, cpu: null, ram_gb: null, disk_gb: null, os: RHEL}

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: ""                 # maas | gpu | none
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services: []              # named external service dependencies e.g. [github.com]
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 1.7
  audience: "intermediate"             # beginner | intermediate | advanced

development:
  automation:
    ansible:
      status: not_started
  e2e:
    status: not_started
  healthCheck:
    status: not_started

compliance:
  last_hard_check: null
  hard_result: null

tracking:
  paused: false
  pause_reason: null

# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: ""
    catalog_gap: ""
    design_overview: "A hands-on intermediate lab covering Red Hat Satellite's compliance scanning, image mode, and vulnerability remediation capabilities against a pre-provisioned Satellite server and two managed RHEL hosts. Participants configure compliance policies, run scans, deploy RHEL image mode builds, and remediate CVEs entirely through Satellite tooling — no prior Satellite experience required."
    module_summaries:
      - title: "Introduction"
        overview: "Orients participants to the lab environment, confirms access to the Satellite Web UI and host terminals, and reviews what will be accomplished across the four modules."
      - title: "Compliance Scanning"
        overview: "Participants create a compliance scanning policy mapped to a security framework, assign it to rhel1.lab and rhel2.lab, run a scan, and interpret the results in the Satellite compliance dashboard."
      - title: "Image Mode"
        overview: "Participants build and publish a RHEL image mode image through Satellite, then deploy that image to a managed host and verify the host has booted into the new image."
      - title: "Vulnerability Remediation"
        overview: "Participants review the vulnerability and errata reports for managed hosts in Satellite, select CVEs to remediate, apply the fixes via Satellite, and confirm the updated errata status."
    rcars_overlap_pct: null
    rcars_top_matches: []
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
    agnosticv_base_ci: ""
    approved_by: ""
    rejections: []
